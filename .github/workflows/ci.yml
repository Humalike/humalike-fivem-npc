name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: resources/humalike/pnpm-lock.yaml
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install Python quality tools
        run: python -m pip install ruff==0.12.11
      - name: Python lint and format
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit public repository
        run: python scripts/audit_public_release.py
      - name: World tests
        working-directory: resources/humalike/world
        run: |
          sh tests/run.sh
          node --check ../server/core/http_node.js
          node tests/core_http_node.cjs
      - name: NPC tests
        working-directory: resources/humalike/npc
        run: |
          for test in tests/*.lua; do
            lua5.4 "$test"
          done
      - name: NPC test panel
        run: |
          lua5.4 examples/humalike-control-test/tests/server.lua
          lua5.4 examples/humalike-control-test/tests/client.lua
          node --check examples/humalike-control-test/web/app.js
          node examples/humalike-control-test/tests/web.cjs
      - name: Voice Lua tests
        working-directory: resources/humalike/voice
        run: |
          for test in tests/*.lua; do
            lua5.4 "$test"
          done
      - name: Voice dependencies
        working-directory: resources/humalike
        run: pnpm install --frozen-lockfile
      - name: Voice typecheck, unit tests, and build
        working-directory: resources/humalike
        run: |
          pnpm check
          pnpm test:unit
          pnpm build
      - name: Verify committed NUI
        run: git diff --exit-code -- resources/humalike/nui/host/dist
      - name: Validate source Lua syntax
        run: find resources examples -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Validate release lock
        run: python -c "from pathlib import Path; from scripts.compose_release import load_lock; load_lock(Path('release.lock.json'))"
      - name: Compose monorepo release
        run: python scripts/compose_release.py --output artifacts
      - name: Compose a second time
        run: python scripts/compose_release.py --output artifacts-second
      - name: Verify deterministic output
        run: cmp artifacts/*.zip artifacts-second/*.zip
      - name: Verify packaged Lua syntax
        run: |
          mkdir release-check
          unzip -q artifacts/*.zip -d release-check
          find release-check -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Audit release archive
        run: python scripts/audit_public_release.py --archive artifacts/*.zip
