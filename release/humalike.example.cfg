# The license is the only HumaLike server credential. Never expose it with `setr`.
set humalike_license_key "ak_secret_replace_me"

# Updates: HumaLike installs signed releases on start (auto), only reports them
# (notify) or never checks (off). Pin a version to stay on it or roll back.
# humalike-updater restarts humalike after an update; these grants allow it.
ensure humalike-updater
add_ace resource.humalike-updater command.refresh allow
add_ace resource.humalike-updater command.ensure allow
add_ace resource.humalike-updater command.stop allow
add_ace resource.humalike-updater command.start allow
# set humalike_auto_update auto
# set humalike_version "0.6.0"

# Enable verbose logs only while troubleshooting.
set humalike_debug 0

# Every humalike_* setting below is a server convar: HumaLike sends the values
# players need to their game on join, so `set` is enough (`setr` also works).

# Integration domains are selected independently. `auto` uses the only
# highest-priority available provider; `none` disables a domain.
# set humalike_player auto
# set humalike_inventory auto
# set humalike_dispatch auto
# set humalike_actions auto
# set humalike_interaction auto

# Keep GTA's random police while HumaLike owns the street population.
# set humalike_population_cops false
# Walk animation rate of the street population; 1.0 is the game's own. Anything
# else costs every client a native per body per frame.
# set humalike_population_move_rate 1.0

# Let persona NPCs spawn driving a car or motorbike. On by default; off means
# everyone spawns on foot.
# set humalike_npc_vehicles true

# Language of the texts HumaLike shows players (the /voice panel and its own
# prompts): en, pl, es or fr. Convar-backed labels below stay overridable one by one.
# set humalike_ui_language en

# Wounded NPCs are treated by players holding a medic job and collected by
# medic or police jobs. ESX, QBCore and Qbox answer from the framework; without
# one, a job is an ACE grant on the player or their group.
# set humalike_npc_medic_jobs "ambulance,ems"
# set humalike_npc_police_jobs "police"
# add_ace group.ems humalike.job.ambulance allow
# add_ace group.police humalike.job.police allow
# add_principal identifier.license:0123456789abcdef group.ems

# AI labels are enabled by default and have no visible-NPC limit. An NPC
# speaking a language other than the server's main one gets a flag on its label;
# set the main language to what most of your NPCs speak. Labels are placed
# 20 times a second (10-60); the overlay smooths the motion in between.
# set humalike_npc_labels_enabled true
# set humalike_npc_labels_distance 14.0
# set humalike_npc_labels_height 0.98
# set humalike_npc_labels_scale 1.0
# set humalike_npc_labels_fps 20
# set humalike_npc_labels_default_language en
# set humalike_npc_labels_show_default_language false
ensure humalike
